# Display profile for the Caiwei projector — installed to ~/.config/kanshi/config
#
# WHY: sent standard 1080p60 TV timing (CEA-861 VIC 16: 148.5 MHz,
# 2200x1125 total), the projector's video board treats the input as VIDEO and
# overscans it — measured ~20-29 px cropped top/bottom, ~35-49 px left/right,
# a ~4-5% enlargement that also resamples every frame. There is no menu
# setting for it, and digital zoom cannot recover it (the crop happens before
# the zoom stage).
#
# A computer-style CVT timing at the same 1920x1080 makes it treat the input
# as PC ("PC mode" in the manual's troubleshooting page is signal-driven, not
# a menu option): measured, all four edges fully visible, no overscan.
#
# 59 Hz, not 60: a 60 Hz custom mode is matched to the existing CEA mode and
# changes nothing. 59 Hz has no TV mode behind it, so a CVT timing is
# generated (169 MHz, 2560x1120 total, 58.94 Hz). Within the manual's 50-60 Hz
# PC-mode window. Irrelevant for a UI.
#
# Matched by EDID identity rather than connector, so it follows the projector
# to either HDMI port. Caveat: this EDID is a generic video-board template
# ("HSI HiTV", serial 1), so another device with the same template would
# match too.
#
# Note: the Raspberry Pi desktop's Screen Configuration tool writes this same
# file; using it may overwrite this profile.

# transform 180 (2026-10-11): the projector now sits on a stand above the
# table, so the image is rotated in the compositor. Touch mapping must use the
# same rotation once the foil is integrated.

profile projector {
    output "HSI HiTV 0x00000001" mode --custom 1920x1080@59Hz position 0,0 transform 180
}
